name: Goal Runner deterministic CI

on:
  push:
    branches: ['pilot/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python sources
        run: python -m compileall -q goal_runner
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v
